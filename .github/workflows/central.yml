name: Central de links

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: central-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  central:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar somente os arquivos públicos
        run: |
          mkdir -p _site
          cp index.html redirect.js config.json .nojekyll _site/
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar página
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v5
